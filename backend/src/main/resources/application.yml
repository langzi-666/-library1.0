server:
  port: 8080
  servlet:
    context-path: /api
  # 压缩响应（减少传输数据量）
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  # Tomcat连接器优化
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000
    accept-count: 100
    connection-timeout: 20000

spring:
  application:
    name: library-management-system
  profiles:
    active: dev
  
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library1.4?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    
    # Druid连接池配置（性能优化）
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 50
      # 监控统计
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
      # 监控统计拦截
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
          merge-sql: true
        wall:
          enabled: true
          config:
            multi-statement-allow: true

# MyBatis Plus配置（性能优化）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境建议使用slf4j，开发环境可以使用stdout
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启二级缓存（可选）
    cache-enabled: false
    # 懒加载配置
    lazy-loading-enabled: false
    aggressive-lazy-loading: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    # 关闭Banner
    banner: false
  mapper-locations: classpath:mapper/*.xml

# JWT配置
jwt:
  # HS512算法需要至少64字符（512位）的密钥
  secret: library-management-system-secret-key-2024-this-is-a-very-long-secret-key-for-jwt-hs512-algorithm-requirement-minimum-64-characters
  expiration: 604800000 # 7天（毫秒）

# 日志配置
logging:
  level:
    com.library: debug
    root: info
    # SQL日志级别
    com.library.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  # 文件日志配置（可选）
  file:
    name: logs/library-system.log
    max-size: 10MB
    max-history: 30


